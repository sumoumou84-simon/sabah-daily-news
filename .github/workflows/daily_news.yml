name: 每日西门日报自动编译推送

on:
  schedule:
    # 国际标准时间 23:50 UTC 对应 马来西亚时间 (GMT+8) 每天早晨 07:50
    - cron: '50 23 * * *'
  workflow_dispatch: # 同时也支持您随时在网页上手动点一下立刻生成

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装必要依赖
        run: |
          pip install google-generativeai

      - name: 运行新闻抓取与编译脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python build_news.py

      - name: 自动提交更新至主分支
        run: |
          git config --global user.name "Simon-Daily-Bot"
          git config --global user.email "bot@simondaily.com"
          git add index.html
          git commit -m "chore: 自动推送今日最新西门日报 [skip ci]" || echo "今日无变动"
          git push
