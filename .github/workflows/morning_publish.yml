name: 每日西门日报全自动采编推送

on:
  schedule:
    - cron: '45 19 * * *'  # 03:45 AM MYT (UTC+8)
  workflow_dispatch: # 保留 GitHub 网页上一键手动立即运行按钮

concurrency:
  group: sabah-news-publishing-lock
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授权 Actions 推送代码回仓库

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装基础依赖
        run: |
          pip install --upgrade pip
          pip install requests urllib3 tzdata || true

      - name: 执行全自动抓取、双核实与页面编译
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python agent_reach_editor.py

      - name: 生产防空屏熔断校验
        run: |
          python -c "import json, sys; d=json.load(open('news_data.json', encoding='utf-8')); count=len(d.get('headlines', [])); sys.exit(0) if count >= 10 else (print(f'CRITICAL: Circuit breaker triggered! Only {count} articles.'), sys.exit(1))"

      - name: 自动提交更新并发布至 GitHub Pages
        run: |
          git config --global user.name "Simon-Daily-Bot"
          git config --global user.email "bot@simondaily.com"
          git add index.html news_data.json archive_history.json config/ collectors/ pipeline/ || true
          git commit -m "chore: [Auto] 自动同步西门看看网每日晨报 [skip ci]" || echo "今日无变动"
          git push
