name: 每日西门日报全自动采编推送

on:
  schedule:
    # 每天 UTC 21:00 运行（严格对应马来西亚时间清晨 05:00 AM 触发上线最新晨报）
    - cron: '0 21 * * *'
  workflow_dispatch: # 保留 GitHub 网页上一键手动立即运行按钮

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授权 Actions 推送代码回仓库

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装基础依赖
        run: |
          pip install --upgrade pip
          pip install requests urllib3 || true

      - name: 执行全自动抓取、双核实与页面编译
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python agent_reach_editor.py

      - name: 自动提交更新并发布至 GitHub Pages
        run: |
          git config --global user.name "Simon-Daily-Bot"
          git config --global user.email "bot@simondaily.com"
          git add index.html news_data.json archive_history.json || true
          git commit -m "chore: [Auto] 自动同步西门看看网每日晨报 [skip ci]" || echo "今日无变动"
          git push
